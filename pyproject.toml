[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lgsh"
version = "0.1.0"
description = "Read-only Linux gaming-setup scanner"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
lgsh-scan = "lgsh.scanner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
